name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # OIDC trusted publishing (no stored NPM_TOKEN needed) requires npm >= 11.5.1;
      # the version bundled with setup-node's Node 22 may be older.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run selfcheck
      - run: npm test
      # No NPM_TOKEN. Publishing goes through OIDC trusted publishing, confirmed
      # by the SLSA provenance attestation on 2.3.0 — npm only attaches that by
      # default for a trusted publish. A stored token here would be a standing
      # credential with nothing to do, which is the opposite of what this
      # project argues for everywhere else.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
